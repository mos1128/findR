name: cache-warm

# 给发布构建预热 Gradle 缓存。为什么要单独一个 workflow：
#   缓存按 ref 隔离，**只有默认分支（main）写进去的，tag 运行才读得到**；
#   在 tag 上写只会存进那个 tag 自己的作用域（谁也读不到，还占 10GB 配额 ——
#   2026-11-20 被 6 个 tag × 1.6GB 的 Flutter SDK 撑爆过一次）。
#   所以分工是：**这里负责写（只在 main 上跑），flutter.yml 的 apk 作业只读。**
#
# 被谁读：.github/workflows/flutter.yml 里「还原 Gradle 缓存（只读）」那一步。
#   ⚠️ 两处的 key 必须一字不差（含 `v1-` 前缀），改一边就要改另一边。
on:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - 'pubspec.lock'
      - '.github/workflows/cache-warm.yml'
  schedule:
    # 每周一跑一次：缓存 7 天没人读会被 GitHub 删掉，靠它续命（也顺带跟一次最新镜像）。
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  warm:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'

      # 与 apk 作业同一个 key。作业结束时由这个 action 写回 main 的作用域。
      # ⚠️ 同名 key 存在之后**不能再覆盖**：缓存内容要变（增删 path）就把 `v1-` 升成 `v2-`。
      - name: 写 Gradle 缓存
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper/dists
          key: gradle-${{ runner.os }}-v1-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties', 'pubspec.lock') }}

      - name: 依赖解析
        run: flutter pub get

      # 用 debug 构建来焐热：与 release 走同一套 Gradle / AGP / Kotlin / androidx / 插件依赖，
      # 但**不需要签名证书**（证书是仓库密钥，这个作业不碰，也就不必为它开权限）。
      # 哪天出现「只在 release 才拉」的依赖，tag 构建现下即可，不影响正确性。
      - name: 焐热依赖（debug 构建）
        run: flutter build apk --debug --target-platform android-arm64
