name: flutter

# 两个作业的定位（**CI 跑测试这件事已经去掉**：改完在本地跑 `flutter test`，
# 发版时 `release.sh` 还会先跑一遍；CI 只留「对本机测不出来的东西」的断言）：
#   - mirror：main 推送时把代码镜像到 Gitee。
#   - apk   ：打发布 tag（`v*`，由仓库根的 release.sh 打）或手动触发时出包：
#             构建 → **三道产物级断言** → 发 GitHub 发布 → 同步 Gitee 发行版。
# 发布 tag 的约定是「一版一 tag、tag = `v` + pubspec 版本号」，tag 的注释里放这次的更新说明
# （release.sh 会问你要，两边的发行版正文都用它）；另有 **fapk-*** 前缀留给「临时出个包」。
on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'fapk-*'
      - 'v*'

permissions:
  contents: write

jobs:
  # ── 把 main 镜像到 Gitee ────────────────────────────────────────────────────
  # 让 Gitee 上的源码跟着 GitHub 走：本地只要推 GitHub，Gitee 那边由 CI 补上，
  # 于是「GitHub 是唯一入口、Gitee 是镜像 + 国内发布目的地」这套结构不需要本地配 Gitee 凭据。
  #
  # ⚠️ 这一步等于**自动把代码放到公开的 Gitee 仓库**（即开源）。不想这么做就删掉这个作业。
  # ⚠️ 只推 main、**不推 tag**：Gitee 上的发布 tag 由 apk 作业建发行版时创建 ——
  #    两边都推同一个 tag 会打架（同一个名字指向不同提交时，git 会拒绝）。
  # 没配 GITEE_TOKEN 时这一步自己早退（fork / 还没建令牌之前都不会因此变红）。
  # ⚠️ 早退写在 run 里而不是 `if:` 里 —— 原因见下面那一步的注释（`secrets` 不能出现在 if 中）。
  # 令牌怎么配：三步照抄《开发指南》5.7。
  mirror:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      # ⚠️ 必须拿**完整历史**（fetch-depth: 0）：checkout 默认是浅克隆（只 1 层），
      #    而服务端会拒绝「从浅克隆推上去」——报 `! [remote rejected] HEAD -> main
      #    (shallow update not allowed)`（2026-10-17 首次镜像实测）。仓库很小，拉全量不心疼。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 镜像 main 到 Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -euo pipefail
          # ⚠️「配没配令牌」的判断只能写在 run 里，**不能写成 `if: secrets.GITEE_TOKEN != ''`** ——
          #    `secrets` 上下文在 `if` 里不可用（if 在作业下发到 runner 之前求值，那时还没有密钥）。
          #    写了不会只跳过这一步，而是让 GitHub 判定**整个 workflow 文件无效**：
          #    表现为工作流 0 秒失败、连日志都没有（本仓库栽过一次，见《开发指南》5.6）。
          #    令牌也只挂在**这一步**的 env 上，不抬到作业级 —— 别让其他 action 顺手读到它。
          if [ -z "${GITEE_TOKEN:-}" ]; then
            echo "未配 GITEE_TOKEN，跳过镜像（配法见《开发指南》5.7）。"
            exit 0
          fi
          # 令牌只写进这一条命令的地址里，不落进 .git/config（Actions 会把日志里的密文打码）。
          # ⚠️ 目的地必须写**全** `refs/heads/main`：CI 里是 detached HEAD（拿在某个提交上），
          #    简写成 `HEAD:main` 时 git 拒绝猜（「not a full refname」，本机实测踩过）。
          # ⚠️ `--progress` 是为了看得见速度：GitHub 的 runner 在境外，推 gitee.com 很慢
          #    （首次 2.9MB 推了 4 分半，≈11KB/s）。没有它日志会干等、看不出是在传还是卡住。
          git push --progress "https://ms6:${GITEE_TOKEN}@gitee.com/ms6/findR.git" "HEAD:refs/heads/main"
          echo "已镜像：https://gitee.com/ms6/findR"
          # 被拒（Gitee 那边有人直接改过代码）就会红在这一步 —— 别硬推，先看一眼两边的历史

  # ── 出包：构建 release APK，并对着**产物本身**断言命门 ─────────────────────────
  apk:
    # ⚠️ 刻意钉死 24.04 而不是 `ubuntu-latest`：2026-10-19 起 `ubuntu-latest` 会迁到 Ubuntu 26，
    #    而下面几步都依赖 runner 镜像的具体形态（预装 Android SDK 的路径、清理里写死的目录）。
    #    镜像换代时这些假设可能不成立，表现就是发版当天构建莫名其妙红掉 —— 钉住，等主动升级。
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/fapk-') || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
        with:
          # 要读出 tag 注释里那份「更新说明」——tag 对象必须被 fetch 下来（顺带留点历史）
          fetch-depth: 20

      # ubuntu-latest 只有约 14GB 可用，Gradle 中间产物很容易撑爆（RN 那边实测过
      # 「No space left on device」）。这里删掉构建用不到的大件。刻意不碰 NDK。
      - name: Free disk space
        run: |
          echo "=== 清理前 ==="; df -h /
          sudo rm -rf /usr/local/lib/android/sdk/system-images || true
          sudo rm -rf /usr/local/lib/android/sdk/emulator || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc /usr/local/.ghcup || true
          sudo rm -rf /usr/share/swift || true
          sudo rm -rf /usr/local/share/boost || true
          sudo apt-get clean
          echo "=== 清理后 ==="; df -h /

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # 沿用 runner 镜像预装的 Android SDK（setup-android 会认不出镜像自带的
      # cmdline-tools 而自作主张再下一份，然后在 licenses 那步失败）。
      - name: Check preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-<未设置>}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-<未设置>}"
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -z "$sdk" ] || [ ! -d "$sdk" ]; then
            echo "::error::runner 上没有 Android SDK，需要另找安装方式"
            exit 1
          fi
          echo "--- platforms ---"; ls "$sdk/platforms" || true
          echo "--- build-tools ---"; ls "$sdk/build-tools" || true

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          cache: true

      - name: 核对工具链版本
        run: |
          flutter --version
          flutter --version 2>&1 | grep -q 'Flutter 3\.47\.5' \
            || { echo "::error::Flutter 版本不是 3.47.5"; exit 1; }

      - name: 依赖解析
        # pub workspaces（2026-09-23 起）：app 与 core 共用一份解析，在仓库根跑一次就够。
        # ⚠️ 必须是 `flutter pub get` 而不是 `dart pub get` —— app 带 Flutter SDK 依赖，
        #    纯 dart 的 pub 解析不了；在 member 目录里单独 pub get 也不再需要。
        run: flutter pub get

      # ⚠️ 这里的测试步骤**刻意没有**：测试在本地跑（改完 `flutter test`；发版时 `release.sh`
      #    还会先跑一遍）。CI 只留「本机测不出来」的东西 —— 也就是下面那三道产物级断言。
      # 发布约定：**一版一 tag**，tag = `v` + pubspec 的版本号（`0.1.0+1` → `v0.1.0+1`）。
      # App 的「检查更新」就是读各渠道「最新一次发布」的 tag 来比版本 ⇒
      # **每次发版必须让 pubspec 的版本号发生变化**（只动 `+` 后面那半也算），
      # 否则 tag 不变，用户那边永远不会出现「新版本」。这里把版本号读出来给后面两步用。
      - name: 读取版本号
        id: ver
        run: |
          set -euo pipefail
          pub="$(grep -m1 '^version:' pubspec.yaml | awk '{print $2}')"
          echo "pubspec 版本：$pub ⇒ 发布 tag：v$pub"
          echo "value=$pub" >> "$GITHUB_OUTPUT"

      - name: Guard release signing config
        working-directory: android/app
        run: |
          # 目前刻意沿用 debug 签名（可覆盖安装、数据保留）。Flutter 模板一旦变更会静默
          # 变成未签名，到真机上就是「解析包错误」，所以在这里挡住。
          if ! grep -q 'signingConfig = signingConfigs.getByName("debug")' build.gradle.kts; then
            echo "::error::release 未使用 debug 签名，请检查 Flutter Gradle 模板变化"
            exit 1
          fi

      - name: Build release APK
        run: |
          # 只编 arm64-v8a：现代手机全是 arm64。Flutter 这边的开关是 --target-platform
          # （RN 那边是 -PreactNativeArchitectures，名字不同、作用一样）。
          # 注意产物名是 `app-release.apk` —— **带 ABI 后缀的 `app-<abi>-release.apk`
          # 只在 `--split-per-abi` 下才有**，别去赌名字（第一次就是栽在这上面）。
          flutter build apk --release --target-platform android-arm64

      # 文件名就是 App 里拼下载地址用的那一个（`lib/platform/update.dart` 的 apkAssetName）。
      # 改了名字而没同步改 App，用户点「下载」就是 404，而这事只有真机上才看得见 —— 挡在构建期。
      - name: 断言 APK 文件名是 app-release.apk
        run: |
          set -euo pipefail
          apk="$(ls build/app/outputs/flutter-apk/*.apk | head -1)"
          base="$(basename "$apk")"
          echo "产物：$base"
          if [ "$base" != "app-release.apk" ]; then
            echo "::error::APK 文件名不是 app-release.apk（App 里按这个名字拼下载地址），实际：$base"
            exit 1
          fi

      - name: 断言 APK 里那份 SQLite 带 FTS5 + trigram（命门的产物级证据）
        run: |
          set -euo pipefail
          echo "=== 产物目录 ==="
          ls -l build/app/outputs/flutter-apk/
          apk="$(ls build/app/outputs/flutter-apk/*.apk | head -1)"
          echo "取用：$apk"

          echo "=== APK 里的原生库 ==="
          unzip -Z1 "$apk" | grep -i '\.so$' | sort -u || true

          # package:sqlite3 3.x 走 Dart build hooks，自带预编译 SQLite（app 端没有任何
          # native 依赖声明）。如果 native assets 没生效，这里就会找不到库 —— 那意味着
          # FTS5 随包一起消失、整套检索方案作废，必须让构建期就失败。
          entry="$(unzip -Z1 "$apk" | grep -i 'sqlite' | grep -i '\.so$' | head -1 || true)"
          if [ -z "$entry" ]; then
            echo "::error::APK 里找不到 SQLite 原生库 —— native assets 没打进包"
            echo "（APK 完整清单如下，便于定位）"
            unzip -Z1 "$apk" | head -200
            exit 1
          fi
          echo "找到：$entry"

          rm -rf /tmp/apk-sqlite && mkdir -p /tmp/apk-sqlite
          unzip -o "$apk" "$entry" -d /tmp/apk-sqlite > /dev/null
          so="/tmp/apk-sqlite/$entry"

          # FTS5 / trigram 是**按名字注册**的模块，名字串会留在二进制里，可以直接查。
          # ⚠️ 这只能证明「编进去了」，证明不了「运行时能跑」—— 后者由真机上的自检屏负责
          #    （lib/selfcheck/self_check_screen.dart）。
          for s in fts5 trigram; do
            n="$(grep -a -o -i "$s" "$so" | wc -l)"
            echo "「$s」在 $so 中出现 $n 次"
            if [ "$n" -eq 0 ]; then
              echo "::error::随包发布的 SQLite 里没有 $s —— 命门不成立"
              exit 1
            fi
          done

      # 权限的「release-only」陷阱：debug/profile 清单里 Flutter 模板自带 INTERNET，
      # 所以 `flutter run` / 冒烟测试一切正常；而 release 走 main 清单，一旦漏声明，
      # 所有域名解析失败（Failed host lookup），且只有装到真机才暴露 —— 2026-09-23 实测踩过。
      # 没有任何插件会替你声明这些，所以只能对着**产物**断言，在构建期就拦住。
      #
      # 三个 token 对应三件「真机上才炸」的事：
      #   · INTERNET：联网（首次撞到的那条，见上）；
      #   · REQUEST_INSTALL_PACKAGES：应用内更新拉起系统安装界面（缺它 canRequestPackageInstalls()
      #     恒 false，安装界面根本起不来）；
      #   · FOREGROUND_SERVICE_DATA_SYNC：下载更新包的前台服务类型（Android 14+ 缺它直接抛异常）。
      - name: 断言合并清单里有必需权限
        run: |
          set -euo pipefail
          apk="$(ls build/app/outputs/flutter-apk/*.apk | head -1)"
          python3 - "$apk" <<'PY'
          import sys, zipfile
          blob = zipfile.ZipFile(sys.argv[1]).read('AndroidManifest.xml')
          tokens = [
              'android.permission.INTERNET',
              'android.permission.REQUEST_INSTALL_PACKAGES',
              'android.permission.FOREGROUND_SERVICE_DATA_SYNC',
          ]
          missing = []
          for token in tokens:
              found = token.encode() in blob or token.encode('utf-16-le') in blob
              print(f'{token} 已合并进 APK 清单:', found)
              if not found:
                  missing.append(token)
          if missing:
              print('::error::合并后的清单缺少权限: ' + ', '.join(missing))
          sys.exit(1 if missing else 0)
          PY

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: findr-flutter-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 7
          if-no-files-found: error

      # 发布正文 = **tag 注释里那份手写的更新说明**（release.sh 会问你要）+ 固定的安装须知。
      # 两个渠道共用这一份（GitHub 用 body_path，Gitee 用 curl 的 `name@文件`）。
      # ⚠️ 里面**不要写 markdown 强调符**：App 的更新弹窗是按纯文本渲染的。
      - name: 组装发布正文
        run: |
          set -euo pipefail
          tag="v${{ steps.ver.outputs.value }}"
          # 手动触发（本地没有这个 tag）或 tag 上没写说明时，给一句人话，别让正文空着
          notes="$(git for-each-ref "refs/tags/$tag" --format='%(contents)' 2>/dev/null || true)"
          if [ -z "$(printf '%s' "$notes" | tr -d '[:space:]')" ]; then
            notes="（本次没有手写更新说明）"
          fi
          mkdir -p build
          {
            printf '%s\n' "$notes"
            echo
            echo "---"
            echo
            echo "findR 的开发版 APK（包名 com.findr.app.dev）。"
            echo
            echo "- 当前沿用 debug 签名：可以覆盖安装、数据保留。"
            echo "- 装好后第一件事：在自检屏上确认七项全绿。"
            echo "- 备份文件（.findrpack）当前是明文 ZIP，谁拿到谁能读。"
            echo "- 安装时直接覆盖安装（别卸载），本地数据不会丢。"
          } > build/release-body.md
          echo "=== 发布正文 ==="
          cat build/release-body.md

      # 发布：**一版一 tag**。App 的「检查更新」读的就是这条发布的 tag，
      # 所以它必须是正式 release（打 prerelease 标记的话，`/releases/latest` 会跳过它）。
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.value }}
          name: Findr 开发版 · Flutter · v${{ steps.ver.outputs.value }}
          body_path: build/release-body.md
          files: build/app/outputs/flutter-apk/*.apk

      # ── 同步到 Gitee（国内的更新源）────────────────────────────────────────────
      # App 的「检查更新」**先问 Gitee**（国内直连最稳），Gitee 不通才落到 GitHub ——
      # 所以两边都得有「最新一次发布」，tag 与 GitHub 那条完全一样。
      #
      # ⚠️ GITEE_TOKEN 没配就整步跳过：别人的 fork、以及你还没建令牌之前，不会因此变红。
      #    令牌怎么配：三步照抄《开发指南》5.7。
      #    ⚠️ 这个「跳过」只能靠 run 里早退实现，**不能写成 `if: secrets.GITEE_TOKEN != ''`** ——
      #       `secrets` 在 `if` 里不可用，写了会让整个 workflow 文件被判无效（0 秒失败、无日志）。
      #
      # ⚠️ 两个「要真跑一次才知道」的点（见《开发指南》5.6）：
      #   1. Gitee 是否接受 tag 里带 `+`（`v0.1.0+1`）；
      #   2. 附件上传接口的字段名是否与文档一致。
      # 这一步一旦报红，就照报错信息在 Gitee 网页上手动补一次发布 —— App 侧不受影响。
      - name: 同步到 Gitee 发行版
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GITEE_TOKEN:-}" ]; then
            echo "未配 GITEE_TOKEN，跳过 Gitee 发行版同步（配法见《开发指南》5.7）。"
            exit 0
          fi
          api="https://gitee.com/api/v5/repos/ms6/findR"
          tag="v${{ steps.ver.outputs.value }}"
          # 路径里用百分号编码过的 tag（`v0.1.0+1` → `v0.1.0%2B1`），免得 `+` 被当空格解
          tag_path="$(python3 -c 'import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1], safe=""))' "$tag")"
          apk="$(ls build/app/outputs/flutter-apk/*.apk | head -1)"

          # 默认分支名：tag 只能指向 Gitee 自己仓库里的提交（GitHub 的 SHA 在这边不存在）
          branch="$(curl -sS "$api?access_token=$GITEE_TOKEN" | python3 -c 'import json,sys;print(json.load(sys.stdin).get("default_branch") or "master")')"
          echo "Gitee 默认分支：$branch"

          # 同名发行版若在（同一版本重跑），先删 —— 附件随之作废，免得同时挂两份
          old_id="$(curl -sS "$api/releases/tags/$tag_path?access_token=$GITEE_TOKEN" | python3 -c 'import json,sys;d=json.load(sys.stdin);print(d.get("id","") if isinstance(d,dict) else "")' 2>/dev/null || true)"
          if [ -n "$old_id" ]; then
            echo "删除旧发行版 id=$old_id"
            curl -sS -X DELETE "$api/releases/$old_id?access_token=$GITEE_TOKEN" -o /dev/null || true
          fi

          # 建发行版。CI 只镜像 main、**不推 tag** ⇒ Gitee 上这个 tag 通常还不存在，用
          # target_commitish 让 Gitee 自己建；若同一版本重跑、tag 已存在，Gitee 可能拒绝这种建法
          # ⇒ 去掉 target_commitish（复用已存在的 tag）再试一次。
          # `--fail-with-body` 让 Gitee 的报错原文直接进日志。
          create_release() {
            curl -sS --fail-with-body -X POST "$api/releases" \
              --data-urlencode "access_token=$GITEE_TOKEN" \
              --data-urlencode "tag_name=$tag" \
              --data-urlencode "name=Findr 开发版 · Flutter · $tag" \
              --data-urlencode "body@build/release-body.md" \
              --data-urlencode "prerelease=false" \
              "$@" \
              -o /tmp/gitee_release.json
          }
          if ! create_release --data-urlencode "target_commitish=$branch"; then
            echo "第一次建发行版没成功（可能 tag 已存在），去掉 target_commitish 再试一次 …"
            create_release
          fi
          new_id="$(python3 -c 'import json;print(json.load(open("/tmp/gitee_release.json"))["id"])')"
          echo "新发行版 id=$new_id"

          # 附件只有安装包（版本号在 tag 里，不再需要额外的版本文件）
          # `-w` 打出耗时与上传速度：runner 在境外、推 gitee.com 很慢（git 推 2.9MB 用了 4 分半），
          # 21MB 的包到底传了多久，只有这行数字说得清。
          curl -sS --fail-with-body -X POST "$api/releases/$new_id/attach_files" \
            -F "access_token=$GITEE_TOKEN" -F "file=@$apk" -o /tmp/gitee_attach.json \
            -w '附件上传耗时 %{time_total}s，平均 %{speed_upload} B/s\n'
          python3 -c 'import json;d=json.load(open("/tmp/gitee_attach.json"));print("附件 OK:", d.get("browser_download_url") or d)'

          # ⚠️ **不自动清理旧的发行版**：删东西这事留给人来定。
          #    要留意的是 Gitee 的容量规矩 —— 单附件 ≤100M、**每仓库附件总量 ≤1G**，
          #    每发一版挂一个包，大约二十来版就会充满；到那时手动删几个旧发行版即可。
          #    （GitHub 那边没有总量限制，历史全留。）
          echo "Gitee 同步完成：https://gitee.com/ms6/findR/releases/tag/$tag_path"
