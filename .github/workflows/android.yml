name: android

# 刻意不挂 push：私有仓库的 Actions 额度有限，而 Android 构建一次要十几分钟。
# 需要出包时用 tag（apk-*）或手动 workflow_dispatch 触发。
on:
  workflow_dispatch:
  push:
    tags:
      - 'apk-*'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ubuntu-latest 只有约 14GB 可用，而 RN 依赖 + Gradle 中间产物 + op-sqlite 的
      # C++ 源码编译（跨多个 ABI）会把磁盘撑爆（实测 32 分钟后 No space left on device）。
      # 这里删掉构建用不到的大件：模拟器镜像与模拟器本体、CodeQL、.NET、Haskell、Swift、Boost。
      # 刻意不碰 NDK —— 它里面的 sources/ 可能有 C++ 编译需要的东西，为这点空间不值得冒险。
      - name: Free disk space
        run: |
          echo "=== 清理前 ==="; df -h /
          sudo rm -rf /usr/local/lib/android/sdk/system-images || true
          sudo rm -rf /usr/local/lib/android/sdk/emulator || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc /usr/local/.ghcup || true
          sudo rm -rf /usr/share/swift || true
          sudo rm -rf /usr/local/share/boost || true
          sudo apt-get clean
          echo "=== 清理后 ==="; df -h /

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # 刻意不用 android-actions/setup-android：它认不出当前 runner 镜像自带的
      # cmdline-tools 12.0（判定为「Wrong version」），会自作主张再下一份，
      # 然后在 sdkmanager --licenses 那步失败。ubuntu 镜像本来就预装了完整 SDK，
      # 这里只把实际情况打出来，真缺东西时能一眼看见。
      - name: Check preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-<未设置>}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-<未设置>}"
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -z "$sdk" ] || [ ! -d "$sdk" ]; then
            echo "::error::runner 上没有 Android SDK，需要另找安装方式"
            exit 1
          fi
          echo "--- platforms ---"; ls "$sdk/platforms" || true
          echo "--- build-tools ---"; ls "$sdk/build-tools" || true
          echo "--- licenses ---"; ls "$sdk/licenses" || true
          if [ ! -d "$sdk/licenses" ]; then
            echo "licenses 目录不存在，尝试用镜像自带的 sdkmanager 接受一次"
            yes | "$sdk/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate native Android project
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --platform android --clean --no-install
        env:
          EXPO_NO_TELEMETRY: '1'

      - name: Guard release signing config
        working-directory: apps/mobile/android
        run: |
          # 目前刻意沿用 debug 签名（用户选择先跑通）。模板一旦变更会静默改成未签名，
          # 到真机上就是「解析包错误」，所以在这里挡住。
          if ! grep -q 'signingConfig signingConfigs.debug' app/build.gradle; then
            echo "::error::release 未使用 debug 签名，请检查 expo prebuild 模板变化"
            exit 1
          fi

      - name: Build release APK
        working-directory: apps/mobile/android
        run: |
          set -o pipefail
          # 只编 arm64-v8a：现代手机全是 arm64，而 4 个 ABI 会让 op-sqlite 那类
          # 需要从 C++ 源码编译的原生库各编一遍，既慢又吃磁盘。
          # 将来要跑 x86_64 模拟器时，把这里改回默认（去掉 -P 参数）即可。
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a 2>&1 | tee gradle-build.log

      - name: Disk usage after build
        if: always()
        working-directory: apps/mobile/android
        run: df -h / || true

      - name: Assert op-sqlite compiled with FTS5
        working-directory: apps/mobile/android
        run: |
          # op-sqlite 只有在它能从 package.json 读到 op-sqlite.fts5 时才会编译 FTS5。
          # 读错文件就会静默少编译，M1 的整个检索方案随之作废 —— 让构建期就失败。
          if grep -q '\[OP-SQLITE\] FTS5 enabled' gradle-build.log; then
            echo "op-sqlite: FTS5 enabled"
          else
            echo "::error::op-sqlite 未检测到 fts5 配置，FTS5 未编译进 APK"
            grep -i 'op-sqlite' gradle-build.log | head -20 || true
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: findr-apk
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk
          retention-days: 7
          if-no-files-found: error

      - name: Publish rolling dev release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-latest
          name: Findr 开发版（最新）
          body: |
            自动构建的开发版 APK，用于真机验收。

            - 当前沿用 **debug 签名**；将来换正式 keystore 必须卸载重装、本地记忆库会清空，
              所以那一步会和 M4 的导出备份同批做。
            - `make install` 不适用，直接在手机浏览器点资源下载安装即可。
          prerelease: true
          files: apps/mobile/android/app/build/outputs/apk/release/*.apk

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: apps/mobile/android/gradle-build.log
          retention-days: 7
          if-no-files-found: ignore
